[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-sbl"
version = "0.1.0"
description = "Thermodynamic foundations for AI ontology"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src", "src.core", "src.operators", "src.validation", "src.visual", "src.interfaces"]
